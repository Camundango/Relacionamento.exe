<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RELACIONAMENTO.EXE — jogo educativo sobre respeito e prevenção da violência</title>
<meta name="description" content="Jogo educativo em formato de conversa sobre relacionamentos, respeito, autonomia, violências invisíveis e cultura digital.">

<style>
:root{
  --bg:#080a0f;
  --panel:#121620;
  --panel-2:#1a1f2b;
  --line:#262d3a;
  --txt:#f2f4f7;
  --muted:#98a1b0;
  --accent:#f2c14e;
  --accent-2:#5ac8b8;
  --danger:#e2665f;
  --info:#6aa9f0;
  --radius:18px;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
}

body{
  background:var(--bg);
  color:var(--txt);
  font-family:"Segoe UI",Inter,system-ui,-apple-system,Arial,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% -10%, rgba(242,193,78,.10), transparent 55%),
    radial-gradient(circle at 90% 100%, rgba(90,200,184,.08), transparent 50%);
}

.wrap{
  position:relative;
  width:min(880px,100%);
  margin:0 auto;
  padding:16px 16px 48px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:8px 4px;
}

.brand{
  font-weight:900;
  letter-spacing:-.5px;
  font-size:15px;
}

.brand .exe{
  color:var(--accent);
}

.linkbtn{
  background:none;
  border:1px solid var(--line);
  color:var(--muted);
  border-radius:999px;
  padding:7px 13px;
  font-size:12px;
  cursor:pointer;
}

.linkbtn:hover{
  color:var(--txt);
  border-color:var(--accent);
}

.card{
  background:linear-gradient(
    180deg,
    rgba(26,31,43,.96),
    rgba(18,22,32,.96)
  );
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:26px;
  margin-top:14px;
  box-shadow:0 24px 70px rgba(0,0,0,.55);
}

.center{
  text-align:center;
}

h1{
  font-size:clamp(30px,8vw,54px);
  line-height:1;
  margin:10px 0 14px;
  letter-spacing:-2px;
}

h1 .exe{
  color:var(--accent);
}

h2{
  font-size:20px;
  margin:0 0 10px;
}

p{
  line-height:1.65;
  color:#d7dce4;
}

.lead{
  font-size:17px;
  color:#c9d0da;
}

.tag{
  display:inline-block;
  font-size:11px;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:var(--accent);
  border:1px solid rgba(242,193,78,.35);
  border-radius:999px;
  padding:6px 11px;
}

.muted{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}

.btn{
  border:0;
  border-radius:12px;
  padding:14px 22px;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
  background:var(--accent);
  color:#12141a;
  transition:.15s;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn.ghost{
  background:transparent;
  color:var(--txt);
  border:1px solid var(--line);
}

.btn.ghost:hover{
  border-color:var(--accent);
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:20px;
}

/* HUD */

.hud{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:12px;
}

.meter{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 12px;
}

.meter .lbl{
  font-size:11px;
  color:var(--muted);
  letter-spacing:.6px;
  display:flex;
  justify-content:space-between;
  gap:6px;
}

.track{
  height:6px;
  border-radius:99px;
  background:#232a36;
  margin-top:8px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:0;
  border-radius:99px;
  transition:width .45s ease;
}

.f-resp{
  background:var(--accent-2);
}

.f-ctrl{
  background:var(--danger);
}

.f-cons{
  background:var(--info);
}

.progress{
  height:6px;
  background:#232a36;
  border-radius:99px;
  overflow:hidden;
  margin:14px 0 4px;
}

.progress > i{
  display:block;
  height:100%;
  background:var(--accent);
  width:0;
  transition:width .4s;
}

.chaptertag{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:var(--muted);
  letter-spacing:1px;
  text-transform:uppercase;
}

/* CHAT */

.chat{
  margin-top:18px;
  display:flex;
  flex-direction:column;
  gap:10px;
  min-height:180px;
}

.msg{
  max-width:82%;
  padding:12px 15px;
  border-radius:16px;
  line-height:1.5;
  font-size:15px;
  animation:pop .25s ease both;
  white-space:pre-wrap;
}

@keyframes pop{
  from{
    opacity:0;
    transform:translateY(8px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

.msg .who{
  display:block;
  font-size:11px;
  letter-spacing:.8px;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:4px;
}

.them{
  align-self:flex-start;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-top-left-radius:5px;
}

.me{
  align-self:flex-end;
  background:rgba(242,193,78,.14);
  border:1px solid rgba(242,193,78,.35);
  border-top-right-radius:5px;
}

.narr{
  align-self:center;
  text-align:center;
  max-width:100%;
  background:transparent;
  border:0;
  color:var(--muted);
  font-size:13px;
  font-style:italic;
}

.typing{
  align-self:flex-start;
  display:flex;
  gap:4px;
  padding:12px 15px;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:16px;
  border-top-left-radius:5px;
}

.typing i{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--muted);
  animation:bl 1s infinite;
}

.typing i:nth-child(2){
  animation-delay:.15s;
}

.typing i:nth-child(3){
  animation-delay:.3s;
}

@keyframes bl{
  0%,60%,100%{
    opacity:.25;
  }

  30%{
    opacity:1;
  }
}

.question{
  margin:18px 0 12px;
  font-size:15px;
  color:var(--muted);
}

.options{
  display:grid;
  gap:10px;
}

.opt{
  width:100%;
  text-align:left;
  padding:15px 16px;
  font-size:15px;
  line-height:1.45;
  cursor:pointer;
  background:var(--panel);
  color:var(--txt);
  border:1px solid var(--line);
  border-radius:14px;
  transition:.15s;
}

.opt:hover{
  border-color:var(--accent);
  background:#20263250;
  transform:translateY(-2px);
}

.opt:disabled{
  opacity:.45;
  cursor:default;
  transform:none;
}

.feedback{
  margin-top:16px;
  padding:16px 18px;
  border-left:3px solid var(--accent);
  background:#0e1117;
  border-radius:12px;
  line-height:1.6;
}

.feedback b{
  color:var(--accent);
}

.delta{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
  font-size:12px;
  color:var(--muted);
}

.delta span{
  border:1px solid var(--line);
  border-radius:99px;
  padding:4px 9px;
}

/* RESULTADO */

.result-icon{
  font-size:52px;
}

.result-title{
  font-size:clamp(24px,6vw,34px);
  margin:6px 0 12px;
  letter-spacing:-1px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:20px 0;
}

.stat{
  background:#0e1117;
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  color:var(--muted);
  font-size:12px;
}

.stat strong{
  display:block;
  color:var(--txt);
  font-size:24px;
  margin-top:6px;
}

ul{
  line-height:1.7;
  color:#d7dce4;
  padding-left:20px;
}

.footer{
  margin-top:22px;
  text-align:center;
  color:#5f6875;
  font-size:11px;
  line-height:1.7;
}

.hidden{
  display:none;
}

@media(max-width:640px){

  .card{
    padding:20px;
  }

  .msg{
    max-width:92%;
    font-size:14.5px;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .hud{
    grid-template-columns:1fr;
  }

  .btn{
    width:100%;
  }
}
</style>
</head>

  C:0,
  S:0,
  choices:0

var MAXES = computeMaxes();


/* =========================================================
   CÁLCULO DOS LIMITES
   ========================================================= */

function computeMaxes(){

  var maxR = 0;
  var minR = 0;
  var maxC = 0;
  var maxS = 0;
  var total = 0;

  CHAPTERS.forEach(function(chapter){

    chapter.steps.forEach(function(step){

      if(step.t !== "choice"){
        return;
      }

      total++;

      var rs = step.opts.map(function(option){
        return option.r;
      });

      maxR += Math.max.apply(null, rs);
      minR += Math.min.apply(null, rs);

      maxC += Math.max.apply(
        null,
        step.opts.map(function(option){
          return option.c;
        })
      );

      maxS += Math.max.apply(
        null,
        step.opts.map(function(option){
          return option.s;
        })
      );

    });

  });

  return {
    maxR:maxR,
    minR:minR,
    maxC:maxC,
    maxS:maxS,
    total:total
  };
}


/* =========================================================
   PORCENTAGEM
   ========================================================= */

function pct(value, min, max){

  if(max === min){
    return 0;
  }

  return Math.max(
    0,
    Math.min(
      1,
      (value - min) / (max - min)
    )
  );
}


/* =========================================================
   RESULTADO
   ========================================================= */

function computeResult(){

  var r = pct(
    state.R,
    MAXES.minR,
    MAXES.maxR
  );

  var c = pct(
    state.C,
    0,
    MAXES.maxC
  );

  var s = pct(
    state.S,
    0,
    MAXES.maxS
  );

  if(c >= 0.55){
    return findRes("controle");
  }

  if(c >= 0.30){
    return findRes("cuidado");
  }

  if(r < 0.55){
    return findRes("ignorados");
  }

  if(r >= 0.90 && s >= 0.80){
    return findRes("respeito");
  }

  if(s >= 0.70){
    return findRes("consciente");
  }

  return findRes("alerta");
}


function findRes(key){

  for(var i = 0; i < RESULTS.length; i++){

    if(RESULTS[i].key === key){
      return RESULTS[i];
    }

  }

  return RESULTS[5];
}

/* =========================================================
   HUD
   ========================================================= */

function hudHtml(){

  var r = Math.round(
    pct(
      state.R,
      MAXES.minR,
      MAXES.maxR
    ) * 100
  );

  var c = Math.round(
    pct(
      state.C,
      0,
      MAXES.maxC
    ) * 100
  );

  var s = Math.round(
    pct(
      state.S,
      0,
      MAXES.maxS
    ) * 100
  );

  return (

    '<div class="hud">' +

      meter("❤️ Respeito","f-resp",r) +

      meter("🔒 Controle","f-ctrl",c) +

      meter("🧠 Consciência","f-cons",s) +

    '</div>'

  );
}


function meter(label, cls, value){

  return (

    '<div class="meter">' +

      '<div class="lbl">' +

        '<span>' +
          label +
        '</span>' +

        '<span>' +
          value +
          '%' +
        '</span>' +

      '</div>' +

      '<div class="track">' +

        '<div class="fill ' +
          cls +
          '" style="width:' +
          value +
          '%">' +
        '</div>' +

      '</div>' +

    '</div>'

  );
}

/* =========================================================
   REPRODUZIR PASSOS
   ========================================================= */

function playSteps(){

  var chapter = CHAPTERS[state.chapter];

  var chat = document.getElementById("chat");

  var step = chapter.steps[state.step];

  if(!step){

    nextChapter();

    return;
  }


  if(step.t === "choice"){

    renderChoice(step);

    return;
  }


  function pushMessage(){

    var message;


    if(step.t === "narr"){

      message = el(
        "div",
        "msg narr",
        esc(step.x)
      );

    }

    else if(step.t === "me"){

      message = el(
        "div",
        "msg me",
        '<span class="who">Você</span>' +
        esc(step.x)
      );

    }

    else{

      message = el(
        "div",
        "msg them",
        '<span class="who">' +
        esc(step.who) +
        '</span>' +
        esc(step.x)
      );

    }


    chat.appendChild(message);

    state.step++;

    timers.push(
      setTimeout(
        playSteps,
        step.t === "narr" ? 280 : 520
      )
    );
  }


  if(step.t === "them"){

    var typing = el(
      "div",
      "typing",
      "<i></i><i></i><i></i>"
    );

    chat.appendChild(typing);

    timers.push(
      setTimeout(
        function(){

          typing.remove();

          pushMessage();

        },
        620
      )
    );

  }

  else{

    pushMessage();

  }
}


/* =========================================================
   RENDERIZAR ESCOLHAS
   ========================================================= */

function renderChoice(step){

  var box = document.getElementById("interaction");

  box.innerHTML =

    '<div class="question">' +
      esc(step.q) +
    '</div>' +

    '<div class="options" id="opts"></div>';


  var opts = document.getElementById("opts");


  step.opts.forEach(function(option, index){

    var button = el(
      "button",
      "opt",
      esc(
        String.fromCharCode(65 + index)
      ) +
      ") " +
      esc(option.x)
    );

    button.type = "button";

    button.onclick = function(){

      pickOption(step, option);

    };

    opts.appendChild(button);

  });
}


/* =========================================================
   ESCOLHER OPÇÃO
   ========================================================= */

function pickOption(step, option){

  var buttons = document.querySelectorAll(
    "#opts .opt"
  );

  for(var i = 0; i < buttons.length; i++){

    buttons[i].disabled = true;

  }


  state.R += option.r;

  state.C += option.c;

  state.S += option.s;

  state.choices++;


  var chat = document.getElementById("chat");


  /*
    IMPORTANTE:

    Opções marcadas com silent:true
    não aparecem como mensagem do jogador.
  */

  if(!option.silent){

    chat.appendChild(
      el(
        "div",
        "msg me",
        '<span class="who">Você</span>' +
        esc(option.x)
      )
    );

  }


  var box = document.getElementById("interaction");


  var feedback = el(
    "div",
    "feedback",
    '<b>Consequência</b><br>' +
    esc(option.f) +

    '<div class="delta">' +

      chip("❤️ Respeito", option.r) +

      chip("🔒 Controle", option.c) +

      chip("🧠 Consciência", option.s) +

    '</div>'
  );


  box.appendChild(feedback);


  var row = el(
    "div",
    "row"
  );


  var buttonText;


  if(
    state.step + 1 >=
    CHAPTERS[state.chapter].steps.length
  ){

    if(
      state.chapter + 1 >=
      CHAPTERS.length
    ){

      buttonText = "Ver resultado";

    }

    else{

      buttonText = "Próximo capítulo";

    }

  }

  else{

    buttonText = "Continuar";

  }


  var button = el(
    "button",
    "btn",
    buttonText
  );


  button.type = "button";


  button.onclick = function(){

    state.step++;


    if(
      state.step >=
      CHAPTERS[state.chapter].steps.length
    ){

      nextChapter();

      return;
    }


    box.innerHTML = "";

    updateHud();

    playSteps();

  };


  row.appendChild(button);

  box.appendChild(row);

  updateHud();


  feedback.scrollIntoView({
    behavior:"smooth",
    block:"nearest"
  });
}


/* =========================================================
   CHIP DE PONTUAÇÃO
   ========================================================= */

function chip(label, value){

  var sign;

  if(value > 0){

    sign = "+" + value;

  }

  else{

    sign = String(value);

  }

  return (
    '<span>' +
      label +
      ' ' +
      sign +
    '</span>'
  );
}


/* =========================================================
   ATUALIZAR HUD
   ========================================================= */

function updateHud(){

  var values = [

    pct(
      state.R,
      MAXES.minR,
      MAXES.maxR
    ),

    pct(
      state.C,
      0,
      MAXES.maxC
    ),

    pct(
      state.S,
      0,
      MAXES.maxS
    )

  ];


  var fills = document.querySelectorAll(".fill");

  var labels = document.querySelectorAll(
    ".meter .lbl span:last-child"
  );


  for(
    var i = 0;
    i < fills.length && i < 3;
    i++
  ){

    var percentage = Math.round(
      values[i] * 100
    );

    fills[i].style.width =
      percentage + "%";


    if(labels[i]){

      labels[i].textContent =
        percentage + "%";

    }

  }
}


/* =========================================================
   PRÓXIMO CAPÍTULO
   ========================================================= */

function nextChapter(){

  state.chapter++;

  state.step = 0;


  if(
    state.chapter >=
    CHAPTERS.length
  ){

    renderResult();

    return;
  }


  renderChapter();
}


/* =========================================================
   RESULTADO FINAL
   ========================================================= */

function renderResult(){

  clearTimers();

  var result = computeResult();


  var r = Math.round(
    pct(
      state.R,
      MAXES.minR,
      MAXES.maxR
    ) * 100
  );


  var c = Math.round(
    pct(
      state.C,
      0,
      MAXES.maxC
    ) * 100
  );


  var s = Math.round(
    pct(
      state.S,
      0,
      MAXES.maxS
    ) * 100
  );


  root.innerHTML = "";


  var card = el(
    "div",
    "card"
  );


  card.innerHTML =

    '<div class="progress">' +
      '<i style="width:100%"></i>' +
    '</div>' +

    '<div class="center">' +

      '<div class="result-icon">' +
        result.icon +
      '</div>' +

      '<div class="result-title" style="color:' +
        result.color +
      '">' +

        esc(result.title) +

      '</div>' +

    '</div>' +

    '<p>' +
      esc(result.text)
        .replace(/\n/g,"<br>") +
    '</p>' +

    '<div class="stats">' +

      '<div class="stat">' +
        '❤️ Respeito' +
        '<strong>' +
          r +
          '%' +
        '</strong>' +
      '</div>' +

      '<div class="stat">' +
        '🔒 Controle' +
        '<strong>' +
          c +
          '%' +
        '</strong>' +
      '</div>' +

      '<div class="stat">' +
        '🧠 Consciência' +
        '<strong>' +
          s +
          '%' +
        '</strong>' +
      '</div>' +

    '</div>' +

    '<p class="muted">' +
      'Você tomou ' +
      state.choices +
      ' decisões nos 6 capítulos. ' +
      'Este resultado descreve as escolhas feitas dentro de uma história ficcional. ' +
      'Ele não avalia, não classifica e não diagnostica ninguém: serve para abrir conversa sobre respeito, autonomia e limites.' +
    '</p>' +

    '<p class="muted">' +
      'Precisa de ajuda ou conhece alguém que precise? ' +
      'Ligue 180 — Central de Atendimento à Mulher. ' +
      'Em emergência, 190.' +
    '</p>' +

    '<div class="row">' +

      '<button class="btn" id="btnAgain" type="button">' +
        'Jogar novamente' +
      '</button>' +

      '<button class="btn ghost" id="btnAbout3" type="button">' +
        'Sobre o projeto' +
      '</button>' +

      '<button class="btn ghost" id="btnHome" type="button">' +
        'Tela inicial' +
      '</button>' +

    '</div>';


  root.appendChild(card);


  document.getElementById("btnAgain").onclick =
    startGame;


  document.getElementById("btnAbout3").onclick =
    renderAbout;


  document.getElementById("btnHome").onclick =
    renderHome;


  window.scrollTo(0,0);
}


/* =========================================================
   BOTÕES DO TOPO
   ========================================================= */

btnAbout.onclick = renderAbout;

btnRestartTop.onclick = renderHome;


/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

renderHome();

</script>

</body>
</html>
